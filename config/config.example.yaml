# Trader Configuration Template
# Copy to config.yaml and fill in your API keys.
# Live mode also requires the --confirm-live CLI flag every session.

venue: "kalshi"
mode: "paper"  # "paper" or "live"

# Two sets of Kalshi credentials. Loader picks `demo` when mode=paper,
# `prod` when mode=live. Demo and prod keys are created separately at
# demo.kalshi.co and kalshi.com respectively and are not interchangeable.
kalshi:
  demo:
    api_base: "https://demo-api.kalshi.co/trade-api/v2"
    ws_url: "wss://demo-api.kalshi.co/trade-api/ws/v2"
    api_key_file: "secrets/kalshi_api_key_demo.pem"
    api_key_id: "YOUR_DEMO_API_KEY_ID"
  prod:
    api_base: "https://api.elections.kalshi.com/trade-api/v2"
    ws_url: "wss://api.elections.kalshi.com/trade-api/ws/v2"
    api_key_file: "secrets/kalshi_api_key_prod.pem"
    api_key_id: "YOUR_PROD_API_KEY_ID"

paths:
  data_dir: "data"
  state_file: "data/state.json"
  calibration_file: "data/calibration.json"

# Phase 2 (unused for now)
dydx:
  api_base: "https://indexer.dydx.trade/v4"

risk:
  max_position_per_market: 10
  max_total_exposure: 80
  max_daily_loss: 15
  kill_switch_loss: 30
  cash_reserve_pct: 0.20
  maker_only: true

feeds:
  open_meteo:
    base_url: "https://ensemble-api.open-meteo.com/v1/ensemble"
    refresh_hours: 6
  bls:
    base_url: "https://api.bls.gov/publicAPI/v2/timeseries/data/"
    api_key: "YOUR_BLS_API_KEY"
  fred:
    base_url: "https://api.stlouisfed.org/fred/"
    api_key: "YOUR_FRED_API_KEY"

strategy:
  # Minimum edge before a trade fires. 8¢ clears round-trip maker fees
  # (~1.7¢) + safety buffer (1¢) + a margin for ensemble noise. Drop to
  # 0.05 only if you're comfortable with edges that barely clear fees.
  min_edge_threshold: 0.08
  # Minimum model confidence. WeatherEnsembleModel scales confidence by
  # ensemble agreement × data completeness; sub-0.3 signals are noise.
  min_confidence: 0.30
  min_spread_to_mm: 0.08
  kelly_fraction: 0.25
  tick_interval_seconds: 60
  # When true, only settled-max weather signals (post-peak observations
  # locked, near-certain outcomes) fire real trades. Ensemble predictions
  # still shadow-log for calibration. The conservative live posture: at
  # $100 bankroll ensemble edge is unproven, settled-max is defensible.
  # Flip to false once the live Brier score for ensemble predictions has
  # beaten the market baseline over several weeks of shadow data.
  settled_max_only: true

# Market-filter thresholds. These are the dominant knob between a bot that
# trades constantly (loose) and one that sits on its hands (tight). Demo
# books are thin — you may want to relax min_volume to 10 to see any
# shadow predictions fire. Prod has real liquidity — keep these tight.
#
# min_spread / max_spread cut two failure modes:
#   - too narrow: no edge room (fees eat it)
#   - too wide:   placeholder books (bid=0, ask=1) that aren't real markets
filter:
  min_volume: 50           # contracts ever traded on this market
  min_spread: 0.03         # 3¢ — tighter than this and fees eat the edge
  max_spread: 0.30         # 30¢ — wider and it's probably a placeholder book
  min_price: 0.15          # skip cheap contracts (favorite-longshot bias)
  max_price: 0.85
  skip_fractional_markets: false  # allow fractional-enabled markets by default

# NBA in-game trading strategy. Disabled by default. When enabled, runs
# alongside the weather/econ strategy — shares the same exchange, risk
# manager, calibration log. NBA signals are generated from the arcsine
# safe-lead model (Clauset/Kogan/Redner 2015) against live game state polled
# from cdn.nba.com.
#
# Live data source: https://cdn.nba.com/static/json/liveData/scoreboard/
# todaysScoreboard_00.json  (no API key, browser-like UA required — handled).
#
# IMPORTANT: at $100-$700 bankroll with max_position_per_game_dollars=$50,
# the strategy can request up to ~100 contracts per market. The global
# `risk.max_position_per_market` defaults to 10 (weather sizing). Raise it
# to 100-200 for NBA play or NBA signals will get gated by the risk
# manager.
nba:
  enabled: false
  min_edge_threshold: 0.04            # |home_wp - market_mid| floor
  max_spread: 0.10                    # skip markets wider than this
  min_seconds_remaining: 60           # skip final minute (model breaks)
  max_seconds_remaining: 1440         # skip first half (talent gap dominates)
  max_position_per_game_dollars: 50.0 # per-market dollar cap
  kelly_fraction: 0.25                # fractional Kelly multiplier
  scoreboard_poll_seconds: 5          # cdn.nba.com is ~3-5s fresh

logging:
  level: "info"
  file: "logs/trader.log"
  console: true
