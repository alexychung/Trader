# NBA in-game Kalshi trading bot — config template.
# Copy to config.yaml and fill in your API keys.
# Live mode also requires the --confirm-live CLI flag every session.

venue: "kalshi"
mode: "paper"  # "paper" (no real orders) or "live" (real money)

# Two sets of Kalshi credentials. Loader picks `demo` when mode=paper,
# `prod` when mode=live. Demo and prod keys are created separately at
# demo.kalshi.co and kalshi.com respectively and are not interchangeable.
kalshi:
  demo:
    api_base: "https://demo-api.kalshi.co/trade-api/v2"
    ws_url: "wss://demo-api.kalshi.co/trade-api/ws/v2"
    api_key_file: "secrets/kalshi_api_key_demo.pem"
    api_key_id: "YOUR_DEMO_API_KEY_ID"
  prod:
    api_base: "https://api.elections.kalshi.com/trade-api/v2"
    ws_url: "wss://api.elections.kalshi.com/trade-api/ws/v2"
    api_key_file: "secrets/kalshi_api_key_prod.pem"
    api_key_id: "YOUR_PROD_API_KEY_ID"

paths:
  data_dir: "data"
  state_file: "data/state.json"
  calibration_file: "data/calibration.json"

risk:
  max_position_per_market: 200
  max_total_exposure: 500
  max_daily_loss: 100
  kill_switch_loss: 200
  cash_reserve_pct: 0.20
  maker_only: true

strategy:
  tick_interval_seconds: 60
  min_edge_threshold: 0.04
  min_confidence: 0.30
  kelly_fraction: 0.25

# NBA in-game trading strategy. Generates signals from the arcsine
# safe-lead model (Clauset/Kogan/Redner 2015) against live game state
# polled from cdn.nba.com.
#
# Live data source: https://cdn.nba.com/static/json/liveData/scoreboard/
# todaysScoreboard_00.json  (no API key, browser-like UA required — handled).
nba:
  enabled: true
  min_edge_threshold: 0.02            # fair_yes - yes_ask - fee_per_contract floor
  max_spread: 0.10                    # skip markets wider than this
  min_seconds_remaining: 60           # skip final minute (model breaks)
  max_seconds_remaining: 1440         # skip first half (talent gap dominates)
  max_position_per_game_dollars: 50.0 # per-market dollar cap
  kelly_fraction: 0.25                # fractional Kelly multiplier
  scoreboard_poll_seconds: 5          # cdn.nba.com is ~3-5s fresh
  # High-confidence gate
  min_abs_score_diff: 8
  max_uncertain_wp: 0.30
  min_strong_wp: 0.70
  # Microstructure improvements (2026-05-20)
  min_lot_size: 5                     # avoid Kalshi fee ceil() on 1-lot quotes
  quote_jitter_pct: 0.20              # ±20% jitter on poll cadence (anti-HFT)
  min_clv_edge: 0.02                  # Pinnacle CLV gate (no-op without sharp-book feed)
  min_market_volume: 100              # skip stale low-volume books
  default_pregame_spread: 0.0         # points, positive = home favored (fallback when no sharp-spread feed)

# Resolution-lag arb strategy. Buys YES on the winning side of an effectively-
# decided game at 0.94-0.99 and holds to settlement.
resolution_lag:
  enabled: true
  cutoff_clock_seconds: 120
  cutoff_lead_points: 15
  include_status_final: true
  min_entry_price: 0.94
  max_entry_price: 0.99
  max_position_per_game_dollars: 25.0
  min_lot_size: 5
  min_market_volume: 50

# External data feeds (optional). Defaults run Null providers (no-op).
feeds:
  oddsapi_key: ""    # https://the-odds-api.com — paste key here to enable CLV gate
  espn_injury_url: "https://www.espn.com/nba/injuries"

logging:
  level: "info"
  file: "logs/trader.log"
  console: true
